<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>매매 기록</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #0b0f14;
      --bg-elev: #121820;
      --bg-card: #161d27;
      --line: #273140;
      --text: #eef2f6;
      --muted: #8b97a8;
      --dim: #5c6b7e;
      --green: #3ee0a0;
      --green-dim: rgba(62, 224, 160, 0.14);
      --red: #ff7a88;
      --amber: #e8c37a;
      --blue: #7eb6ff;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(62, 224, 160, 0.08), transparent 50%),
        radial-gradient(900px 400px at 100% 0%, rgba(126, 182, 255, 0.07), transparent 45%),
        var(--bg);
      color: var(--text);
      letter-spacing: -0.02em;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: calc(28px + var(--safe-top)) 16px calc(96px + var(--safe-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
    }
    .eyebrow {
      color: var(--green);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 720;
      letter-spacing: -0.04em;
    }
    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .account {
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      border-radius: 16px;
      padding: 12px 16px;
      min-width: 168px;
    }
    .account .label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }
    .account .num {
      font-size: 18px;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .stats {
      display: grid;
      grid-template-columns: 1.35fr repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .stat.featured {
      background: linear-gradient(180deg, rgba(62, 224, 160, 0.1), var(--bg-card));
      border-color: rgba(62, 224, 160, 0.28);
    }
    .stat .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .stat .value {
      font-size: 24px;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }
    .stat.featured .value { font-size: 28px; }
    .stat .value.up { color: var(--green); }
    .stat .value.down { color: var(--red); }
    .stat .hint {
      margin-top: 6px;
      color: var(--dim);
      font-size: 12px;
    }
    .stat-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    .stat-split .value { font-size: 24px; }
    .stat.featured .stat-split .value { font-size: 24px; }
    button { font-family: inherit; }
    button:hover { filter: brightness(1.06); }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(62, 224, 160, 0.55);
      outline-offset: 2px;
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px 16px 8px;
      margin-bottom: 14px;
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 650;
      color: var(--muted);
    }

    .panel.months-panel { padding: 14px; }
    .trend {
      margin: 0 0 12px;
      min-height: 78px;
    }
    .trend svg { width: 100%; height: 78px; display: block; }
    .trend .line { fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .trend .area { fill: rgba(62, 224, 160, 0.12); }
    .trend .dot { fill: var(--green); }
    .trend .lbl { fill: var(--dim); font-size: 10px; }
    .trend .val { fill: var(--green); font-size: 10px; font-weight: 650; }
    .panel h2 .hint-inline {
      margin-left: 8px;
      font-weight: 500;
      color: var(--dim);
    }
    .months { display: grid; gap: 8px; }
    .month-block {
      border: 1px solid var(--line);
      background: var(--bg-elev);
      border-radius: 12px;
      overflow: hidden;
    }
    .month-summary {
      width: 100%;
      display: grid;
      grid-template-columns: 52px 40px 1fr 1fr 16px;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: transparent;
      border: 0;
      color: inherit;
      font: inherit;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      text-align: left;
      cursor: pointer;
    }
    .month-summary:hover { background: rgba(255, 255, 255, 0.03); filter: none; }
    .month-block.open { border-color: rgba(62, 224, 160, 0.28); }
    .month-summary .name { font-weight: 720; }
    .month-summary .cnt { color: var(--dim); }
    .month-summary .sum, .month-summary .avg {
      text-align: right;
      font-weight: 650;
      color: var(--green);
    }
    .month-summary .down { color: var(--red); }
    .month-summary .chev {
      color: var(--dim);
      transition: transform 0.22s ease;
      justify-self: end;
    }
    .month-block.open .chev { transform: rotate(90deg); color: var(--green); }
    .month-items {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s ease;
      padding: 0 8px;
    }
    .month-block.open .month-items { grid-template-rows: 1fr; padding-bottom: 8px; }
    .month-inner {
      overflow: hidden;
      display: grid;
      gap: 4px;
      min-height: 0;
    }
    .month-block.open .month-item {
      animation: rise 0.32s ease both;
    }
    .flash { animation: flash 1.1s ease; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes barIn {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes flash {
      from { background: rgba(62, 224, 160, 0.22); }
      to { background: transparent; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .foot .sync.ok::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.8s ease infinite;
      vertical-align: 1px;
    }
    .month-item {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) 92px 72px minmax(40px, 0.8fr);
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 0;
      border-radius: 10px;
      color: inherit;
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .month-item:hover { background: #1c2530; filter: none; }
    .mi-name { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mi-date { color: var(--dim); font-size: 12px; }
    .mi-ret { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--green); }
    .mi-ret.down { color: var(--red); }
    .bar-track {
      height: 4px;
      background: #222b37;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--green);
      border-radius: 99px;
      transform-origin: left;
      animation: barIn 0.55s ease both;
    }
    @media (prefers-reduced-motion: reduce) {
      .month-items, .month-summary .chev, .bar-fill, .month-item, .flash, .foot .sync.ok::before {
        animation: none !important;
        transition: none !important;
      }
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="search"] {
      flex: 1;
      min-width: 0;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      font-size: 16px;
      outline: none;
    }
    input[type="search"]:focus { border-color: #3d4d63; }
    .btn {
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      padding: 12px 14px;
    }
    .btn-primary { background: var(--green); color: #062016; }
    .btn-ghost {
      background: var(--bg-elev);
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .btn-danger { background: transparent; color: var(--red); }
    .btn-edit {
      background: var(--bg-elev);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-edit:hover { color: var(--text); border-color: #3d4d63; filter: none; }
    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      width: 100%;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .chip:hover { color: var(--text); border-color: #3d4d63; filter: none; }
    .chip.active {
      border-color: rgba(62, 224, 160, 0.4);
      background: var(--green-dim);
      color: var(--green);
    }

    .list-panel { padding: 14px 10px 10px; }
    .list-panel h2 { padding: 0 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      vertical-align: middle;
    }
    th {
      color: var(--dim);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
    td.name { font-weight: 650; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .ret { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--green); }
    .ret.down { color: var(--red); }
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 650;
      padding: 3px 7px;
      border-radius: 999px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .tag.swing { background: rgba(126, 182, 255, 0.12); color: var(--blue); }
    .tag.mid { background: rgba(232, 195, 122, 0.12); color: var(--amber); }
    .tag.long { background: var(--green-dim); color: var(--green); }
    .note {
      display: block;
      margin-top: 4px;
      color: var(--dim);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
    }
    .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
    .foot {
      margin-top: 12px;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.6;
    }
    .foot .sync.ok { color: var(--green); }
    .foot .sync.bad { color: var(--amber); }

    .cards { display: none; }
    .card {
      border: 1px solid var(--line);
      background: var(--bg-elev);
      border-radius: 14px;
      padding: 14px;
      margin: 8px 4px;
    }
    .card:hover { border-color: #354557; }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .card-name { font-weight: 700; font-size: 16px; }
    .card-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }
    .card-prices {
      margin-top: 6px;
      color: var(--dim);
      font-size: 12px;
    }
    .card .ret { font-size: 18px; }

    .fab {
      display: none;
      position: fixed;
      right: 16px;
      bottom: calc(16px + var(--safe-bottom));
      z-index: 20;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 18px;
      background: var(--green);
      color: #062016;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 12, 0.62);
      z-index: 30;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .overlay.open { display: flex; }
    .sheet {
      width: min(520px, 100%);
      background: #141b24;
      border: 1px solid var(--line);
      border-radius: 20px 20px 0 0;
      padding: 12px 16px calc(16px + var(--safe-bottom));
      max-height: min(92vh, 760px);
      overflow: auto;
    }
    .grab {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: #334155;
      margin: 4px auto 12px;
    }
    .sheet h3 { margin: 0 0 14px; font-size: 18px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 12px; }
    .field input, .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      font-size: 16px;
      outline: none;
    }
    .field textarea { min-height: 72px; resize: vertical; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      grid-column: 1 / -1;
      padding: 4px 0 6px;
    }
    .check input { width: 18px; height: 18px; }
    .sheet-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .sheet-actions .btn { flex: 1; }
    .err { color: var(--red); font-size: 12px; min-height: 18px; margin-top: 6px; }

    @media (min-width: 821px) {
      .overlay { align-items: center; padding: 24px; }
      .sheet {
        border-radius: 20px;
        padding: 20px 20px 18px;
      }
      .grab { display: none; }
    }

    @media (max-width: 820px) {
      h1 { font-size: 26px; }
      header { flex-direction: column; align-items: stretch; }
      .account { display: flex; justify-content: space-between; align-items: baseline; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat.featured { grid-column: 1 / -1; }
      .table-wrap { display: none; }
      .cards { display: block; }
      .btn-add { display: none; }
      .fab { display: block; }
      .wrap { padding-left: 12px; padding-right: 12px; }
      .month-summary {
        grid-template-columns: 44px 36px 1fr 1fr 16px;
        padding: 12px;
      }
      .month-item {
        grid-template-columns: 1fr auto;
        padding: 10px 12px;
      }
      .mi-date, .month-item .bar-track { display: none; }
    }

    @media (max-width: 420px) {
      .form-grid { grid-template-columns: 1fr; }
      .field.half { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">스윙 · 중장기</p>
        <h1>매매 기록</h1>
        <p class="sub">수익률을 달별로 보고, 종목은 눌러서 수정합니다.</p>
      </div>
      <div class="account">
        <div class="label">나의 계좌</div>
        <div class="num">5624-1531</div>
      </div>
    </header>

    <section class="stats" id="stats"></section>

    <section class="panel months-panel">
      <h2>월별 매매 기준 <span class="hint-inline">달을 누르면 종목이 펼쳐집니다</span></h2>
      <div class="trend" id="trend"></div>
      <div class="months" id="months"></div>
    </section>

    <div class="toolbar">
      <input type="search" id="q" placeholder="종목 검색" enterkeyhint="search" />
      <button class="btn btn-primary btn-add" id="addBtn" type="button">매매 추가</button>
      <button class="btn btn-ghost" id="exportBtn" type="button">매매.txt 저장</button>
      <div class="chips" id="chips"></div>
    </div>

    <section class="panel list-panel">
      <h2>전체 기록</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-key="sellDate">매도일</th>
              <th data-key="name">종목</th>
              <th data-key="buyDate">매수일</th>
              <th class="num" data-key="buyPrice">매수</th>
              <th class="num" data-key="sellPrice">매도</th>
              <th class="num" data-key="holdingDays">보유</th>
              <th class="num" data-key="returnPct">수익률</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="cards" id="cards"></div>
    </section>
    <p class="foot">
      <span id="sync" class="sync">저장소 연결 중…</span>
      · 총 수익률은 각 매매 수익률을 더한 값입니다. (투자금 비중은 반영하지 않습니다)
    </p>
  </div>

  <button class="fab" id="fab" type="button">추가</button>

  <div class="overlay" id="overlay">
    <form class="sheet" id="form" autocomplete="off">
      <div class="grab"></div>
      <h3 id="formTitle">매매 추가</h3>
      <div class="form-grid">
        <div class="field full">
          <label for="fName">종목</label>
          <input id="fName" name="name" required placeholder="예: LB세미콘" />
        </div>
        <div class="field">
          <label for="fBuyDate">매수일</label>
          <input id="fBuyDate" name="buyDate" type="date" required />
        </div>
        <div class="field">
          <label for="fSellDate">매도일</label>
          <input id="fSellDate" name="sellDate" type="date" required />
        </div>
        <div class="field">
          <label for="fBuyPrice">매수가 (원)</label>
          <input id="fBuyPrice" name="buyPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="선택" />
        </div>
        <div class="field">
          <label for="fSellPrice">매도가 (원)</label>
          <input id="fSellPrice" name="sellPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="선택" />
        </div>
        <div class="field">
          <label for="fReturn">수익률 (%)</label>
          <input id="fReturn" name="returnPct" type="number" inputmode="decimal" step="0.01" required />
        </div>
        <label class="check"><input id="fSplit" name="split" type="checkbox" /> 분할매수</label>
        <div class="field full">
          <label for="fNote">메모</label>
          <textarea id="fNote" name="note" placeholder="분할 단가, 비중 등"></textarea>
        </div>
      </div>
      <p class="err" id="formErr"></p>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelBtn" type="button">취소</button>
        <button class="btn btn-danger" id="deleteBtn" type="button" hidden>삭제</button>
        <button class="btn btn-primary" type="submit">저장</button>
      </div>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "stockRecord.trades.v1";
    const ACCOUNT = "5624-1531";
    const SEED = [
      { id: 1, name: "LB세미콘", buyDate: "2026-07-01", sellDate: "2026-08-18", buyPrice: null, sellPrice: null, returnPct: 19.98, holdingDays: 48, split: false, note: "" },
      { id: 2, name: "디티씨", buyDate: "2026-05-28", sellDate: "2026-08-12", buyPrice: null, sellPrice: null, returnPct: 14.18, holdingDays: 76, split: false, note: "" },

    function setSync(ok, text) {
      remoteOk = ok;

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch (e) {}
      return SEED.map((t) => ({ ...t }));
    }

    async function saveTrades() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(trades));
      if (!remoteOk) return;
      const res = await fetch("/api/trades", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ trades })
      });
      if (!res.ok) {
        setSync(false, "서버 저장 실패 · 이 브라우저에만 반영됨");
        throw new Error("save failed");
      }
    }

    async function pullRemote() {
      if (!remoteOk) return;
      if (document.getElementById("overlay").classList.contains("open")) return;
      const res = await fetch("/api/trades");
      if (!res.ok) return;
      const data = await res.json();
      if (!Array.isArray(data.trades)) return;
      if (JSON.stringify(data.trades) !== JSON.stringify(trades)) {
        const before = new Map(trades.map((t) => [String(t.id), JSON.stringify(t)]));
        trades = data.trades;
        renderAll();
        const changed = trades.filter((t) => before.get(String(t.id)) !== JSON.stringify(t)).map((t) => t.id);
        highlight(changed);
      }
    }

    async function init() {
      try {
        const res = await fetch("/api/trades");
        if (!res.ok) throw new Error("no api");
        const data = await res.json();
        if (Array.isArray(data.trades) && data.trades.length) {
          trades = data.trades;
        } else {
          trades = loadLocal();
          remoteOk = true;
          await saveTrades();
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(trades));
        setSync(true, "폰과 PC에서 같은 기록을 씁니다");
      } catch (e) {
        trades = loadLocal();
        setSync(false, "공유 저장소 없음 · 이 브라우저에만 저장됩니다");
      }
      renderAll();
      setInterval(() => { pullRemote().catch(() => {}); }, 4000);
    }

    const styleOf = (days) => Number(days) <= 10 ? "swing" : Number(days) <= 40 ? "mid" : "long";
    const styleLabel = { swing: "스윙", mid: "중기", long: "장기" };
    const won = (n) => n == null || n === "" ? "—" : Number(n).toLocaleString("ko-KR") + "원";
    const ymd = (s) => {
      if (!s) return "—";
      const [y, m, d] = s.split("-");
      return `${Number(m)}/${Number(d)}`;
    };
    const pct = (n) => (Number(n) > 0 ? "+" : "") + Number(n).toFixed(2) + "%";
    const tone = (n) => Number(n) < 0 ? "down" : "up";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function numOrNull(v) {
      if (v === "" || v == null) return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function daysBetween(a, b) {
      if (!a || !b) return "";
      const da = new Date(a + "T00:00:00");
      const db = new Date(b + "T00:00:00");
      return Math.round((db - da) / 86400000);
    }
    function holdDays(t) {
      const n = daysBetween(t.buyDate, t.sellDate);
      return n === "" ? 0 : n;
    }

    function filtered() {
      return trades.filter((t) => {
        if (state.q && !t.name.includes(state.q.trim())) return false;
        if (state.filter === "swing") return styleOf(holdDays(t)) === "swing";
        if (state.filter === "mid") return styleOf(holdDays(t)) === "mid";
        if (state.filter === "long") return styleOf(holdDays(t)) === "long";
        if (state.filter === "split") return t.split;
        return true;
      }).slice().sort((a, b) => {
        const av = state.sortKey === "holdingDays" ? holdDays(a) : a[state.sortKey];
        const bv = state.sortKey === "holdingDays" ? holdDays(b) : b[state.sortKey];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === "string") return av.localeCompare(bv) * state.sortDir;
        return (av - bv) * state.sortDir;
      });
    }

    function monthStats() {
      const map = {};
      for (const t of trades) {
        if (!t.sellDate) continue;
        const key = t.sellDate.slice(0, 7);
        if (!map[key]) map[key] = { sum: 0, n: 0, best: -Infinity, items: [] };
        const r = Number(t.returnPct || 0);
        map[key].sum += r;
        map[key].n += 1;
        map[key].items.push(t);
        if (r > map[key].best) map[key].best = r;
      }
      return Object.entries(map)
        .sort((a, b) => b[0].localeCompare(a[0]))
        .map(([k, v]) => ({
          k,
          avg: v.sum / v.n,
          n: v.n,
          sum: v.sum,
          best: v.best,
          items: v.items.slice().sort((a, b) => Number(b.returnPct) - Number(a.returnPct))
        }));
    }

    function renderStats() {
      const n = trades.length;
      const months = monthStats();
      const monthAvg = months.length ? months.reduce((s, m) => s + m.sum, 0) / months.length : null;
      if (!n) {
        document.getElementById("stats").innerHTML = `

        return;
      }
      const total = trades.reduce((s, t) => s + Number(t.returnPct || 0), 0);
      const avg = total / n;
      const wins = trades.filter((t) => Number(t.returnPct) > 0).length;
      const best = trades.reduce((a, b) => Number(a.returnPct) > Number(b.returnPct) ? a : b);
      const hold = trades.reduce((s, t) => s + holdDays(t), 0) / n;
      const swing = trades.filter((t) => styleOf(holdDays(t)) === "swing").length;
      const mid = trades.filter((t) => styleOf(holdDays(t)) === "mid").length;
      const long = trades.filter((t) => styleOf(holdDays(t)) === "long").length;
      document.getElementById("stats").innerHTML = `
        <article class="stat featured">
          <div class="stat-split">
            <div>
              <div class="label">총 수익률</div>

            <div>
              <div class="label">월별평균</div>
              <div class="value ${tone(monthAvg)}" data-count="${monthAvg}" data-kind="pct">${pct(monthAvg)}</div>
            </div>
          </div>
          <div class="hint">매매 ${n}건 합계 · ${months.length}개월 · 계좌 ${ACCOUNT}</div>
        </article>
        <article class="stat"><div class="label">거래</div><div class="value" data-count="${n}" data-kind="int" data-suffix="건">${n}건</div><div class="hint">승률 ${(wins / n * 100).toFixed(0)}%</div></article>
        <article class="stat"><div class="label">평균 수익률</div><div class="value ${tone(avg)}" data-count="${avg}" data-kind="pct">${pct(avg)}</div><div class="hint">건당 단순평균</div></article>
        <article class="stat"><div class="label">최고</div><div class="value ${tone(best.returnPct)}" data-count="${best.returnPct}" data-kind="pct">${pct(best.returnPct)}</div><div class="hint">${esc(best.name)}</div></article>
        <article class="stat"><div class="label">평균 보유</div><div class="value" data-count="${hold}" data-kind="int" data-suffix="일">${hold.toFixed(0)}일</div><div class="hint">스윙 ${swing} · 중기 ${mid} · 장기 ${long}</div></article>
      `;
    }

    function renderMonths() {
      const rows = monthStats();
      if (!rows.length) {
        document.getElementById("months").innerHTML = `<div class="empty">아직 기록이 없습니다.</div>`;
        return;
      }
      if (state.openMonth == null) state.openMonth = rows[0].k;
      else if (state.openMonth && !rows.some((r) => r.k === state.openMonth)) state.openMonth = rows[0].k;
      document.getElementById("months").innerHTML = rows.map((r) => {
        const m = Number(r.k.split("-")[1]);

    function mmdd(s) {
      if (!s) return "";
      const p = s.split("-");
      return (p[1] || "") + (p[2] || "");
    }

    function tradesToTxt() {
      const list = trades.slice().sort((a, b) => (b.sellDate || "").localeCompare(a.sellDate || ""));
      return list.map((t) => {
        const hold = holdDays(t);
        const ret = pct(t.returnPct);
        const note = t.note ? " / " + t.note : "";
        if (t.split) {
          return t.name + "\t: 분할매수 / " + mmdd(t.buyDate) + "매수 / " + mmdd(t.sellDate) + "매도 / " + hold + "D / " + ret + note;
        }
        if (t.buyPrice != null && t.sellPrice != null) {
          return t.name + "\t: " + mmdd(t.buyDate) + "(" + t.buyPrice + ") - " + mmdd(t.sellDate) + "(" + t.sellPrice + ") / " + hold + "D / " + ret + note;
        }
        return t.name + "\t: " + mmdd(t.buyDate) + "매수 / " + mmdd(t.sellDate) + "매도 / " + hold + "D / " + ret + note;
      }).join("\n\n") + "\n";
    }

    function idbHandle() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("stockRecord", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("files");
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function getTxtHandle() {
      const db = await idbHandle();
      return new Promise((resolve, reject) => {
        const g = db.transaction("files", "readonly").objectStore("files").get("매매.txt");
        g.onsuccess = () => resolve(g.result || null);
        g.onerror = () => reject(g.error);
      });
    }

    async function setTxtHandle(handle) {
      const db = await idbHandle();
      return new Promise((resolve, reject) => {
        const p = db.transaction("files", "readwrite").objectStore("files").put(handle, "매매.txt");
        p.onsuccess = () => resolve();
        p.onerror = () => reject(p.error);
      });
    }

    async function writeSameFile(text) {
      if (!window.showSaveFilePicker) return false;
      let handle = await getTxtHandle().catch(() => null);
      if (handle) {
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm !== "granted") {
          const next = await handle.requestPermission({ mode: "readwrite" });
          if (next !== "granted") handle = null;
        }
      }
      if (!handle) {
        handle = await window.showSaveFilePicker({
          suggestedName: "매매.txt",
          types: [{ description: "Text", accept: { "text/plain": [".txt"] } }]
        });
        await setTxtHandle(handle);
      }
      const w = await handle.createWritable();
      await w.write(text);
      await w.close();
      return true;
    }

    async function exportTxt() {
      const text = tradesToTxt();
      const btn = document.getElementById("exportBtn");
      try {
        const wrote = await writeSameFile(text);
        if (!wrote) {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
          a.download = "매매.txt";
          a.click();
          URL.revokeObjectURL(a.href);
        }
        btn.textContent = "저장됨";
        setTimeout(() => { btn.textContent = "매매.txt 저장"; }, 1400);
      } catch (e) {
        if (e && e.name === "AbortError") return;
        btn.textContent = "저장 실패";
        setTimeout(() => { btn.textContent = "매매.txt 저장"; }, 1400);
      }
    }

    function renderTrend() {
      const el = document.getElementById("trend");
      const rows = monthStats().slice().reverse();
      if (!el) return;
      if (rows.length < 2) {
        el.innerHTML = "";
        return;
      }
      const w = 640;
      const h = 78;
      const padX = 22;
      const padT = 16;
      const padB = 22;
      const max = Math.max(...rows.map((r) => r.sum), 1);
      const pts = rows.map((r, i) => {
        const x = padX + (i / (rows.length - 1)) * (w - padX * 2);
        const y = padT + (1 - r.sum / max) * (h - padT - padB);
        return { x, y, r };
      });
      const d = pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
      const area = d + " L " + pts[pts.length - 1].x.toFixed(1) + " " + (h - padB) + " L " + pts[0].x.toFixed(1) + " " + (h - padB) + " Z";
      el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <path class="area" d="${area}"></path>
        <path class="line" d="${d}"></path>
        ${pts.map((p) => `<circle class="dot" cx="${p.x}" cy="${p.y}" r="3.2"></circle>
          <text class="lbl" text-anchor="middle" x="${p.x}" y="${h - 6}">${Number(p.r.k.split("-")[1])}월</text>
          <text class="val" text-anchor="middle" x="${p.x}" y="${Math.max(11, p.y - 8)}">${pct(p.r.sum)}</text>`).join("")}
      </svg>`;
    }

    function reduceMotion() {
      return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function runCounts() {
      if (reduceMotion()) return;
      document.querySelectorAll("[data-count]").forEach((el) => {
        const to = Number(el.dataset.count);
        if (!Number.isFinite(to)) return;
        const kind = el.dataset.kind;
        const suffix = el.dataset.suffix || "";
        const start = performance.now();
        const dur = 650;
        const tick = (now) => {
          const t = Math.min(1, (now - start) / dur);
          const e = 1 - Math.pow(1 - t, 3);
          const cur = to * e;
          if (kind === "pct") el.textContent = pct(cur);
          else el.textContent = Math.round(cur) + suffix;
          if (t < 1) requestAnimationFrame(tick);
          else if (kind === "pct") el.textContent = pct(to);
          else el.textContent = Math.round(to) + suffix;
        };
        requestAnimationFrame(tick);
      });
    }

    function highlight(ids) {
      if (!ids.length) return;
      ids.forEach((id) => {
        document.querySelectorAll(`[data-edit="${id}"], [data-row="${id}"]`).forEach((el) => {
          el.classList.remove("flash");
          void el.offsetWidth;
          el.classList.add("flash");
        });
      });
    }

    function renderAll() {
      renderStats();
      renderTrend();
      renderMonths();
      renderChips();
      renderTable();
      runCounts();
    }

    function openForm(trade) {
      const form = document.getElementById("form");
      form.reset();
      document.getElementById("formErr").textContent = "";
      state.editId = trade ? trade.id : null;
      document.getElementById("formTitle").textContent = trade ? "매매 수정" : "매매 추가";
      document.getElementById("deleteBtn").hidden = !trade;
      document.getElementById("fName").value = trade?.name || "";
      document.getElementById("fBuyDate").value = trade?.buyDate || "";
      document.getElementById("fSellDate").value = trade?.sellDate || "";
      document.getElementById("fBuyPrice").value = trade?.buyPrice ?? "";
      document.getElementById("fSellPrice").value = trade?.sellPrice ?? "";
      document.getElementById("fReturn").value = trade?.returnPct ?? "";
      document.getElementById("fSplit").checked = !!trade?.split;
      document.getElementById("fNote").value = trade?.note || "";
      document.getElementById("overlay").classList.add("open");
      document.body.style.overflow = "hidden";
      document.getElementById("fName").focus();
    }

    function closeForm() {
      document.getElementById("overlay").classList.remove("open");
      document.body.style.overflow = "";
      state.editId = null;
    }

    function syncHoldAndReturn() {
      const buy = numOrNull(document.getElementById("fBuyPrice").value);
      const sell = numOrNull(document.getElementById("fSellPrice").value);
      if (buy && sell) {
        document.getElementById("fReturn").value = (((sell - buy) / buy) * 100).toFixed(2);
      }
    }

    document.getElementById("q").addEventListener("input", (e) => {
      state.q = e.target.value;
      renderTable();
    });
    document.getElementById("chips").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      state.filter = btn.dataset.id;
      renderChips();
      renderTable();
    });
    document.querySelectorAll("th[data-key]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (state.sortKey === key) state.sortDir *= -1;
        else { state.sortKey = key; state.sortDir = key === "name" ? 1 : -1; }
        renderTable();
      });
    });
    document.getElementById("months").addEventListener("click", (e) => {
      if (e.target.closest("[data-edit]")) return;
      const btn = e.target.closest("[data-month]");
      if (!btn) return;
      const key = btn.dataset.month;
      state.openMonth = state.openMonth === key ? "" : key;
      document.querySelectorAll(".month-block").forEach((block) => {
        const b = block.querySelector("[data-month]");
        const open = b && b.dataset.month === state.openMonth;
        block.classList.toggle("open", open);
        if (b) b.setAttribute("aria-expanded", open ? "true" : "false");
      });
    });
    document.getElementById("addBtn").addEventListener("click", () => openForm(null));
    document.getElementById("exportBtn").addEventListener("click", () => exportTxt());
    document.getElementById("fab").addEventListener("click", () => openForm(null));
    document.getElementById("cancelBtn").addEventListener("click", closeForm);
    document.getElementById("overlay").addEventListener("click", (e) => {
      if (e.target.id === "overlay") closeForm();
    });
    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-edit]");
      if (!btn) return;
      const trade = trades.find((t) => String(t.id) === String(btn.dataset.edit));
      if (trade) openForm(trade);
    });
    ["fBuyDate", "fSellDate", "fBuyPrice", "fSellPrice"].forEach((id) => {
      document.getElementById(id).addEventListener("change", syncHoldAndReturn);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.getElementById("overlay").classList.contains("open")) closeForm();
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("fName").value.trim();
      const buyDate = document.getElementById("fBuyDate").value;
      const sellDate = document.getElementById("fSellDate").value;
      const returnPct = numOrNull(document.getElementById("fReturn").value);
      const err = document.getElementById("formErr");
      if (!name || !buyDate || !sellDate || returnPct == null) {
        err.textContent = "종목, 날짜, 수익률은 필수입니다.";
        return;
      }
      const next = {
        id: state.editId || Date.now(),
        name,
        buyDate,
        sellDate,
        buyPrice: numOrNull(document.getElementById("fBuyPrice").value),
        sellPrice: numOrNull(document.getElementById("fSellPrice").value),
        holdingDays: daysBetween(buyDate, sellDate),
        returnPct: Number(returnPct.toFixed(2)),
        split: document.getElementById("fSplit").checked,
        note: document.getElementById("fNote").value.trim()
      };
      if (state.editId) {
        trades = trades.map((t) => t.id === state.editId ? next : t);
      } else {
        trades = [next, ...trades];
      }
      try {
        await saveTrades();
      } catch (e) {
        err.textContent = "서버 저장에 실패했습니다. 다시 시도하세요.";
        return;
      }
      closeForm();
      renderAll();
    });

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!state.editId) return;
      if (!confirm("이 매매 기록을 삭제할까요?")) return;
      trades = trades.filter((t) => t.id !== state.editId);
      try {
        await saveTrades();
      } catch (e) {
        return;
      }
      closeForm();
      renderAll();
    });

    init();
  </script>
</body>
</html>
